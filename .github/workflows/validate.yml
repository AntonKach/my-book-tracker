name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Reject committed deployment credentials
        shell: bash
        run: |
          if git grep -nE 'AIza[[:alnum:]_-]{20,}|script\.google\.com/macros/s/[[:alnum:]_-]{20,}/exec' -- ':!*.md'; then
            echo 'Potential credential or deployment URL in tracked files.'
            exit 1
          fi
